name: KOReader
options:
  bundleIdPrefix: rocks.koreader
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  # The project lives at the repo root so paths in `sources`/`scripts`
  # resolve naturally to the rest of the tree.
  generateEmptyDirectories: true

settings:
  base:
    ENABLE_BITCODE: NO
    SWIFT_VERSION: "5.0"
    # Skip the simulator slice for now — base/ libs are device-only.
    SUPPORTED_PLATFORMS: iphoneos
    ONLY_ACTIVE_ARCH: YES
    ARCHS: arm64
    VALID_ARCHS: arm64
    # Xcode 27's minimum. The pre-build phase hands this to make, so base/
    # builds into base/build/arm64-apple-ios<this>.
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: N4ZMG97CA9
    PRODUCT_NAME: KOReader
    # App Store versions must be up to three integers, so this tracks the
    # upstream KOReader release (v2026.03) rather than `git describe`.
    # The build number is overridden per upload (iosb: commit count).
    MARKETING_VERSION: "2026.3"
    CURRENT_PROJECT_VERSION: "1"

targets:
  KOReader:
    type: application
    platform: iOS
    sources:
      - path: platform/ios/ios_loader.m
        type: file
      - path: platform/ios/ios_filepicker.m
        type: file
      - path: platform/ios/Assets.xcassets
      - path: platform/ios/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.crosbyhayton.koreader
        INFOPLIST_FILE: platform/ios/Info.plist.in
        CODE_SIGN_ENTITLEMENTS: platform/ios/KOReader.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Header / library search paths point at the `base/build` tree
        # produced by `make TARGET=ios base`. The pre-build script makes
        # sure that's up-to-date before we start compiling.
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/base/build/arm64-apple-ios$(IPHONEOS_DEPLOYMENT_TARGET)/staging/include
          - $(SRCROOT)/base/build/arm64-apple-ios$(IPHONEOS_DEPLOYMENT_TARGET)/staging/include/luajit-2.1
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/base/build/arm64-apple-ios$(IPHONEOS_DEPLOYMENT_TARGET)/libs
          - $(SRCROOT)/base/build/arm64-apple-ios$(IPHONEOS_DEPLOYMENT_TARGET)/staging/lib
        OTHER_LDFLAGS:
          - -lluajit
          - -lSDL3
        # rpath so dyld finds the dylibs the post-build script wraps into
        # Frameworks/<name>.framework.
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
        # Embedded dylibs need this; iOS 14+ enforces it.
        LD_DYLIB_INSTALL_NAME: ""
        # Quiet the noisy override of macOS-isms.
        CLANG_ENABLE_OBJC_ARC: YES
    dependencies:
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: CoreFoundation.framework
      - sdk: UniformTypeIdentifiers.framework
    preBuildScripts:
      - name: Build base/ libs and staging tree
        # Plain $VAR below, not ${VAR}: XcodeGen expands ${VAR} from its own
        # environment when generating the project.
        script: |
          set -euo pipefail
          # Xcode strips PATH down. Reinstate Homebrew GNU tools used by
          # KOReader's Makefile.
          BREW_PREFIX="$(PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" brew --prefix)"
          export PATH="$BREW_PREFIX/opt/findutils/libexec/gnubin:$BREW_PREFIX/opt/gnu-getopt/bin:$BREW_PREFIX/opt/make/libexec/gnubin:$BREW_PREFIX/opt/util-linux/bin:$BREW_PREFIX/bin:$PATH"
          cd "$SRCROOT"
          # Headless builds check out the superproject commit only; bring
          # base/ and the other submodules along when they're missing or stale.
          if git submodule status --recursive | grep -q '^[-+]'; then
            git submodule update --init --recursive
          fi
          # `all` (not `base`) so the koreader-ios-…/koreader staging
          # tree gets assembled too — the post-build script rsyncs from
          # there into the .app.
          # Xcode exports its build settings (SDKROOT, IPHONEOS_DEPLOYMENT_TARGET,
          # …) into this script. They leak into base's host-tool builds
          # (LuaJIT's buildvm, meson's build-machine compiler) and turn them
          # into iOS binaries macOS kills, so build base in a clean environment.
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" TMPDIR="$TMPDIR" \
            LANG="en_US.UTF-8" DEVELOPER_DIR="$DEVELOPER_DIR" \
            make TARGET=ios IOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" all
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed assets and dylibs
        script: |
          set -euo pipefail
          "${SRCROOT}/platform/ios/embed-bundle-payload.sh"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(WRAPPER_NAME)/app/reader.lua
